<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Movie Management</title>
</head>
<body>
  <div class="container">
    <h1>Movie Management</h1>

    <form id="movieForm">
      <div class="form-row">
        <label for="title">제목</label>
        <input type="text" id="title">
      </div>
      <div class="form-row">
        <label for="director">감독</label>
        <input type="text" id="director">
      </div>
      <div class="form-row">
        <label for="genre">장르</label>
        <select id="genre">
          <option value="">-- 선택 --</option>
          <option value="액션">액션</option>
          <option value="드라마">드라마</option>
          <option value="코미디">코미디</option>
          <option value="SF">SF</option>
          <option value="공포">공포</option>
          <option value="로맨스">로맨스</option>
          <option value="애니메이션">애니메이션</option>
          <option value="뮤지컬">뮤지컬</option>
        </select>
      </div>
      <div class="form-row">
        <label for="year">개봉연도</label>
        <input type="number" id="year">
      </div>
      <div class="form-row">
        <label for="rating">평점</label>
        <input type="number" id="rating" step="0.5">
      </div>
      <div class="btn-area">
        <button type="button" id="saveBtn">Add</button>
        <button type="button" id="cancelBtn" style="display: none;">취소</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th><th>제목</th><th>감독</th><th>장르</th>
          <th>개봉연도</th><th>평점</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="movieTable"></tbody>
    </table>
  </div>

  <script>
    let movies = [
      { id: 1, title: "인터스텔라", director: "Christopher Nolan", genre: "SF", year: 2014, rating: 9.5 },
      { id: 2, title: "기생충", director: "봉준호", genre: "드라마", year: 2019, rating: 9.0 },
      { id: 3, title: "라라랜드", director: "Damien Chazelle", genre: "뮤지컬", year: 2016, rating: 8.5 }
    ];

    let nextId = 4;

    function render() {
      const tbody = document.getElementById("movieTable");
      tbody.innerHTML = "";

      movies.forEach(function (movie) {
        const tr = document.createElement("tr");

        const values = [movie.id, movie.title, movie.director, movie.genre, movie.year, movie.rating];
        values.forEach(function (value) {
          const td = document.createElement("td");
          td.innerText = value;
          tr.appendChild(td);
        });

        const btnTd = document.createElement("td");

        const editBtn = document.createElement("button");
        editBtn.innerText = "수정";
        editBtn.className = "edit-btn";

        const delBtn = document.createElement("button");
        delBtn.innerText = "삭제";
        delBtn.className = "del-btn";

        btnTd.appendChild(editBtn);
        btnTd.appendChild(delBtn);
        tr.appendChild(btnTd);

        tbody.appendChild(tr);
      });
    }

    function getFormData() {
      return {
        title: document.getElementById("title").value.trim(),
        director: document.getElementById("director").value.trim(),
        genre: document.getElementById("genre").value,
        year: Number(document.getElementById("year").value),
        rating: Number(document.getElementById("rating").value)
      };
    }

    function clearForm() {
      document.getElementById("movieForm").reset();
    }

    function addMovie() {
      const data = getFormData();

      const newMovie = {
        id: nextId,
        title: data.title,
        director: data.director,
        genre: data.genre,
        year: data.year,
        rating: data.rating
      };

      movies.push(newMovie);
      nextId++;

      clearForm();
      render();
    }

    window.onload = function () {
      render();

      document.getElementById("saveBtn").addEventListener("click", function () {
        addMovie();
      });
    };
  </script>
</body>
</html>
